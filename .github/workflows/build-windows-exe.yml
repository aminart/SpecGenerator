name: Build Windows exe

# Fabrique SpecGenerator.exe sur une machine Windows de GitHub :
# - à chaque push : l'exe est disponible en artefact « SpecGenerator-windows » (utilisé par build_exe_mac.sh) ;
# - à chaque release publiée (tag vX.Y.Z) : l'exe est en plus joint à la release, sous le nom
#   SpecGenerator-X.Y.Z.exe. Le tag doit correspondre au fichier specGen-main/VERSION.

on:
  push:
    paths:
      - "specGen-main/**"
      - ".github/workflows/build-windows-exe.yml"
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: specGen-main
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "SpecGen $version"
          if [ "${{ github.event_name }}" = "release" ]; then
            tag="${{ github.event.release.tag_name }}"
            if [ "$tag" != "v$version" ]; then
              echo "::error::Le tag $tag ne correspond pas au fichier VERSION ($version). Lancer scripts/bump_version.py avant la release."
              exit 1
            fi
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: specGen-main/backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: specGen-main/frontend/package-lock.json

      - name: Frontend
        working-directory: specGen-main/frontend
        run: |
          npm ci
          npm run build

      - name: Exécutable
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pyinstaller
          pyinstaller --noconfirm SpecGenerator.spec

      - name: Vérification
        run: ./dist/SpecGenerator.exe --version

      - name: Vérification des conversions (Word, Excel, PowerPoint, PDF, HTML, texte)
        run: |
          set -u
          python - <<'PY'
          import docx, openpyxl, pptx
          d = docx.Document(); d.add_heading("Titre Word", 1); d.save("ex.docx")
          wb = openpyxl.Workbook(); wb.active.append(["Nom", "Nb"]); wb.active.append(["Accueil", 3]); wb.save("ex.xlsx")
          p = pptx.Presentation(); s = p.slides.add_slide(p.slide_layouts[1]); s.shapes.title.text = "Diapo"; p.save("ex.pptx")
          open("ex.html", "w").write("<h1>Titre HTML</h1>")
          open("ex.txt", "w", encoding="utf-8").write("Texte accentué")
          # PDF minimal avec une ligne de texte
          objs = ["<< /Type /Catalog /Pages 2 0 R >>", "<< /Type /Pages /Kids [3 0 R] /Count 1 >>",
                  "<< /Type /Page /Parent 2 0 R /MediaBox [0 0 300 200] /Contents 4 0 R /Resources << /Font << /F1 5 0 R >> >> >>",
                  "<< /Length 42 >>\nstream\nBT /F1 18 Tf 30 120 Td (Bonjour PDF) Tj ET\nendstream",
                  "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>"]
          out, offs = "%PDF-1.4\n", []
          for i, o in enumerate(objs, 1):
              offs.append(len(out)); out += f"{i} 0 obj\n{o}\nendobj\n"
          x = len(out)
          out += f"xref\n0 {len(objs) + 1}\n0000000000 65535 f \n" + "".join(f"{o:010d} 00000 n \n" for o in offs)
          out += f"trailer\n<< /Size {len(objs) + 1} /Root 1 0 R >>\nstartxref\n{x}\n%%EOF\n"
          open("ex.pdf", "w").write(out)
          PY
          ./dist/SpecGenerator.exe --port 8597 --no-browser &
          for i in $(seq 90); do curl -sf http://127.0.0.1:8597/health >/dev/null && break; sleep 1; done
          verifier() {
            r=$(curl -s -F "file=@$1" http://127.0.0.1:8597/api/markdown/convert)
            echo "$1 -> $r"
            echo "$r" | grep -q "$2" || { echo "::error::Conversion de $1 : « $2 » attendu"; exit 1; }
          }
          verifier ex.docx "Titre Word"
          verifier ex.xlsx "| Accueil | 3 |"
          verifier ex.pptx "Diapo"
          verifier ex.pdf "Bonjour PDF"
          verifier ex.html "Titre HTML"
          verifier ex.txt "Texte accent"
          ls -l dist/SpecGenerator.exe

      - uses: actions/upload-artifact@v4
        with:
          name: SpecGenerator-windows
          path: specGen-main/dist/SpecGenerator.exe
          if-no-files-found: error

      - name: Joindre l'exe et le zip à la release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="SpecGenerator-${{ steps.version.outputs.version }}.exe"
          cp dist/SpecGenerator.exe "dist/$name"
          # Zip à côté de l'exe (même contenu que l'artefact des Actions).
          base="SpecGenerator-${{ steps.version.outputs.version }}-windows"
          mkdir -p "dist/zip/$base"
          cp dist/SpecGenerator.exe "dist/zip/$base/"
          cp CHANGELOG.md "dist/zip/$base/"
          (cd dist/zip && python -m zipfile -c "../$base.zip" "$base")
          gh release upload "${{ github.event.release.tag_name }}" "dist/$name" "dist/$base.zip" --clobber
